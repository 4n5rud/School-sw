    account-id: 8abcc1ccfb278ca2c5b3e8ba07623e9e
    access-key-id: c211d096273a1dc3559889a3fe3aa477
    secret-access-key: 3459d5f634ce642c667d15f09c1d498f42ed88df9edb3e09e24128ab85bd0c48
    bucket: stockclass
