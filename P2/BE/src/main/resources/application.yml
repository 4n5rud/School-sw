spring:
  application:
    name: BE
  datasource:
    url: jdbc:mysql://localhost:3306/stock_class?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT Configuration
jwt:
  secret: your-secret-key-must-be-at-least-32-characters-long-for-hs256-algorithm-12345678
  access-token-expiration: 3600000 # 1시간 (밀리초)
  refresh-token-expiration: 604800000 # 7일 (밀리초)

# Cloudflare R2 Configuration (더미값 - 실제 사용 시 교체)
